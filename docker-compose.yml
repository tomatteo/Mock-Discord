services:

  # Aplicação PHP
  web:
    build:
      context: .
      dockerfile: dockerfile
    container_name: mock-discord-web
    ports:
      - "8080:80"
    volumes:
        - ./src:/var/www/html
        - ./style:/var/www/assets/style
        - ./js:/var/www/assets/js
        - server_icons:/var/www/assets/img
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # API e eventos em tempo real
  backend:
    build: ./backend
    container_name: mock-discord-backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      PHP_AUTH_URL: http://web/includes/socketAuth.php
    depends_on:
      - web
    restart: unless-stopped

  # Banco de dados MySQL
  db:
    image: mysql:8.4
    container_name: mock-discord-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: discord
      MYSQL_USER: discord_user
      MYSQL_PASSWORD: discord_password
    volumes:
      - dados_mysql:/var/lib/mysql
      - ./database/discord.sql:/docker-entrypoint-initdb.d/01-discord.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Gerenciador visual do banco
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mock-discord-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

# Persistência dos dados do MySQL
volumes:
  dados_mysql:
  server_icons: