<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar - Discord Mock</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#5865F2] min-h-screen flex items-center justify-center p-4 font-sans antialiased">

    <!-- Card Principal -->
    <div class="bg-[#36393F] w-full max-w-[480px] rounded-md shadow-2xl p-8 sm:p-10">
        
        <!-- Cabeçalho -->
        <div class="text-center mb-6">
            <h1 class="text-white text-2xl font-bold">Registre-se no Discord</h1>
        </div>

        <!-- Formulário -->
        <form action="#" method="POST" class="space-y-4">
            
            <!-- Campo Nome de Usuário -->
            <div>
                <label for="reg-username" class="block text-[#B9BBBE] text-xs font-bold uppercase tracking-wide mb-2">
                    Nome de Usuário <span class="text-[#F04747]">*</span>
                </label>
                <input 
                    type="text" 
                    id="reg-username" 
                    name="username" 
                    required
                    class="w-full bg-[#202225] text-[#DCDDDE] h-11 px-3 rounded-[4px] border border-transparent focus:border-[#5865F2] focus:outline-none transition-colors"
                >
            </div>

            <!-- Campo Email -->
            <div>
                <label for="reg-email" class="block text-[#B9BBBE] text-xs font-bold uppercase tracking-wide mb-2">
                    Email <span class="text-[#F04747]">*</span>
                </label>
                <input 
                    type="email" 
                    id="reg-email" 
                    name="email" 
                    required
                    class="w-full bg-[#202225] text-[#DCDDDE] h-11 px-3 rounded-[4px] border border-transparent focus:border-[#5865F2] focus:outline-none transition-colors"
                >
            </div>

            <!-- Campo Número de Telefone -->
            <div>
                <label for="reg-telefone" class="block text-[#B9BBBE] text-xs font-bold uppercase tracking-wide mb-2">
                    Número de Telefone <span class="text-[#F04747]">*</span>
                </label>
                <input 
                    type="tel" 
                    id="reg-telefone" 
                    name="telefone" 
                    required
                    class="w-full bg-[#202225] text-[#DCDDDE] h-11 px-3 rounded-[4px] border border-transparent focus:border-[#5865F2] focus:outline-none transition-colors"
                >
            </div>

            <!-- Campo Senha -->
            <div>
                <label for="reg-senha" class="block text-[#B9BBBE] text-xs font-bold uppercase tracking-wide mb-2">
                    Senha <span class="text-[#F04747]">*</span>
                </label>
                <input 
                    type="password" 
                    id="reg-senha" 
                    name="senha" 
                    required
                    class="w-full bg-[#202225] text-[#DCDDDE] h-11 px-3 rounded-[4px] border border-transparent focus:border-[#5865F2] focus:outline-none transition-colors"
                >
            </div>

            <!-- Link para Login (posicionado acima do botão, igual ao wireframe) -->
            <div class="pt-1 text-sm text-[#72767D]">
                Já possui uma conta? 
                <a href="login.html" class="text-[#00A8FC] hover:underline font-medium">Entrar</a>
            </div>

            <!-- Botão Criar Conta -->
            <div class="pt-2">
                <button 
                    type="submit" 
                    class="w-full bg-[#5865F2] hover:bg-[#4752C4] text-white font-semibold h-11 rounded-[4px] uppercase tracking-wide transition-colors cursor-pointer"
                >
                    Criar Conta
                </button>
            </div>

        </form>

    </div>

</body>
</html>
