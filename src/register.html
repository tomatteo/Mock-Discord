<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar - Discord Mock</title>
    <link rel="stylesheet" href="../style/auth.css">
</head>
<body class="pagina-auth">

    <!-- Card Principal de Registro -->
    <main class="auth-card">
        <header class="auth-header">
            <h1>Registre-se no Discord</h1>
        </header>

        <section aria-label="Formulário de cadastro">
            <form id="form-register" class="auth-form" action="index.html" method="POST" novalidate>
                
                <div class="campo-grupo">
                    <label for="reg-username">
                        Nome de Usuário <span class="asterisco-obrigatorio">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="reg-username" 
                        name="username" 
                        required
                        minlength="3"
                        maxlength="32"
                        pattern="[A-Za-z0-9_.-]+"
                        autocomplete="username"
                    >
                    <span id="erro-username" class="mensagem-erro" role="alert"></span>
                </div>

                <div class="campo-grupo">
                    <label for="reg-email">
                        Email <span class="asterisco-obrigatorio">*</span>
                    </label>
                    <input 
                        type="email" 
                        id="reg-email" 
                        name="email" 
                        required
                        autocomplete="email"
                    >
                    <span id="erro-email" class="mensagem-erro" role="alert"></span>
                </div>

                <div class="campo-grupo">
                    <label for="reg-telefone">
                        Número de Telefone <span class="asterisco-obrigatorio">*</span>
                    </label>
                    <input 
                        type="tel" 
                        id="reg-telefone" 
                        name="telefone" 
                        required
                        pattern="\(\d{2}\)\s\d{4,5}-\d{4}"
                        autocomplete="tel"
                    >
                    <span id="erro-telefone" class="mensagem-erro" role="alert"></span>
                </div>

                <div class="campo-grupo">
                    <label for="reg-senha">
                        Senha <span class="asterisco-obrigatorio">*</span>
                    </label>
                    <input 
                        type="password" 
                        id="reg-senha" 
                        name="senha" 
                        required
                        minlength="6"
                        autocomplete="new-password"
                    >
                    <span id="erro-senha" class="mensagem-erro" role="alert"></span>
                </div>

                <div class="auth-footer-interno">
                    Já possui uma conta? 
                    <a href="index.html" class="auth-link">Entrar</a>
                </div>

                <button type="submit" class="btn-primario btn-uppercase">
                    Criar Conta
                </button>
            </form>
        </section>
    </main>

    <!-- Aviso educacional obrigatório do edital -->
    <footer class="aviso-academico">
        <p>Clone do Discord desenvolvido para fins educacionais. Sem vínculo com a empresa original. Todos os dados são ficticios.</p>
    </footer>

    <script src="../js/auth.js"></script>
</body>
</html>
