Alias /style/ /var/www/assets/style/
Alias /js/ /var/www/assets/js/
Alias /img/ /var/www/assets/img/
Alias /sons/ /var/www/assets/sons/

ProxyPass /socket.io/ http://backend:3001/socket.io/ upgrade=websocket
ProxyPassReverse /socket.io/ http://backend:3001/socket.io/

<Directory /var/www/assets>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
